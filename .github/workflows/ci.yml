name: checks

# Lightweight, browser-free checks. The full end-to-end suite (dev/test/smoke.mjs)
# needs a real Chromium with the unpacked extension loaded, so it runs locally:
#   cd dev && pnpm install && node test/smoke.mjs

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check all extension scripts
        run: |
          set -e
          for f in src/*.js src/*.mjs desktop/*.cjs desktop/*.mjs; do
            node --check "$f"
            echo "ok $f"
          done

      - name: Backend regression tests (no network or secrets)
        run: node --test dev/test/unit.mjs dev/test/layout.mjs dev/test/backup-unit.mjs dev/test/reader-unit.mjs dev/test/chat.mjs dev/test/desktop-unit.mjs

      - name: Validate manifest.json
        run: |
          node -e "const m=require('./manifest.json');
            if(m.manifest_version!==3) throw new Error('manifest_version must be 3');
            for (const k of ['name','version','background','content_scripts','icons']) if(!m[k]) throw new Error('missing '+k);
            console.log('manifest ok:', m.name, m.version);"

      - name: Fail if secrets or local config slipped in
        run: |
          set -e
          if git ls-files | grep -q 'config.local.json'; then
            echo 'config.local.json must never be committed'; exit 1
          fi
          if git grep -n -I -E 'sk-[A-Za-z0-9]{16,}' -- . ':!config.local.example.json'; then
            echo 'looks like an API key is committed'; exit 1
          fi
          echo 'no secrets found'

      - name: Python tool syntax
        run: |
          python3 -m compileall -q dev/tools && echo 'python tools ok'

      # Regression guard: a UTF-8 file that was once read as GBK (the Windows PowerShell 5.1
      # default) ends up containing Private Use Area chars or U+20AC (CP936 maps byte 0x80 to
      # it). That silently corrupts Chinese text - it happened to README.md once.
      - name: No mojibake (encoding damage) in text files
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          files = subprocess.run(['git','ls-files','-z'], capture_output=True, check=True).stdout.decode().split('\0')
          # deny-list rather than allow-list: LICENSE has no extension and must be checked too
          binary_ext = {'.png','.jpg','.jpeg','.gif','.ico','.pdf','.zip','.bcmap','.pfb','.ttf','.otf','.woff','.woff2','.exe','.dll'}
          skip_prefix = ('vendor/', 'icons/', 'docs/')
          bad, checked = [], 0
          for f in files:
              if not f or f.startswith(skip_prefix):
                  continue
              if pathlib.Path(f).suffix.lower() in binary_ext:
                  continue
              try:
                  text = pathlib.Path(f).read_text(encoding='utf-8-sig')
              except (UnicodeDecodeError, IsADirectoryError):
                  continue   # binary or unreadable - nothing to check
              checked += 1
              n_pua = sum(1 for c in text if 0xE000 <= ord(c) <= 0xF8FF)
              n_eur = text.count('\u20ac')
              if n_pua or n_eur:
                  bad.append(f'{f}: {n_pua} PUA chars, {n_eur} U+20AC')
          if bad:
              print('mojibake detected:')
              print('\n'.join('  ' + b for b in bad))
              sys.exit(1)
          print(f'encoding clean ({checked} text files checked)')
          PY
