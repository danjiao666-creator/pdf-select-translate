<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF 划词翻译</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="tb-group tb-doc">
        <span class="brand" title="PDF 划词翻译">译</span>
        <span class="docname" id="docName">未打开文件</span>
      </div>

      <div class="tb-group">
        <button id="prevPage" class="icon" title="上一页 (PageUp / ←)">‹</button>
        <input id="pageInput" class="page-input" type="text" inputmode="numeric" value="1" />
        <span class="muted">/ <span id="pageCount">-</span></span>
        <button id="nextPage" class="icon" title="下一页 (PageDown / →)">›</button>
      </div>

      <div class="tb-group">
        <button id="zoomOut" class="icon" title="缩小 (Ctrl+-)">−</button>
        <span id="zoomLabel" class="muted zoom-label">100%</span>
        <button id="zoomIn" class="icon" title="放大 (Ctrl+=)">+</button>
        <button id="fitWidth" class="active" title="适应宽度">适宽</button>
      </div>

      <div class="tb-group">
        <label class="field">译成
          <select id="targetLang">
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁體中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="ru">Русский</option>
          </select>
        </label>
        <label class="field">引擎
          <select id="engine">
            <option value="auto">自动</option>
            <option value="google">Google（免费）</option>
            <option value="microsoft">Microsoft（免费）</option>
            <option value="youdao">有道（免费）</option>
            <option value="mymemory">MyMemory（免费）</option>
            <option value="custom">自定义 API</option>
          </select>
        </label>
        <label class="chk" title="把划选的片段自动扩展到完整句子">
          <input type="checkbox" id="sentenceMode" checked /> 整句
        </label>
        <label class="chk" title="选中后立刻翻译（关闭则先显示“译”按钮）">
          <input type="checkbox" id="autoTranslate" checked /> 选中即译
        </label>
      </div>

      <div class="tb-group tb-right">
        <button id="openLocal">打开本地 PDF</button>
        <a id="openOriginal" class="btn-link" target="_blank" rel="noreferrer" hidden>原始文件</a>
        <button id="openOptions" title="扩展设置">设置</button>
        <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden />
      </div>
    </header>

    <main id="viewport">
      <div id="pages"></div>

      <section id="empty" class="empty">
        <h1>PDF 划词翻译</h1>
        <p>把 PDF 拖到这里，或者选择本地文件开始。<strong>选中任意句子即可即时翻译。</strong></p>
        <div class="empty-actions">
          <button id="emptyPick" class="primary">选择本地 PDF</button>
          <button id="emptyClose">收起</button>
        </div>
        <p class="muted small">
          提示：在普通标签页里打开 PDF 时，点扩展图标 →「用翻译阅读器打开本 PDF」，即可获得真正的划词翻译体验。
        </p>
      </section>
    </main>

    <div id="status" class="status" hidden></div>

    <div id="card" class="pt-card" hidden>
      <div class="pt-head">
        <span class="pt-badge" id="cardBadge">…</span>
        <span class="pt-title" id="cardTitle">划词翻译</span>
        <button class="pt-act" id="cardRetry" title="重新翻译">重译</button>
        <button class="pt-act" id="cardCopy">复制</button>
        <button class="pt-act" id="cardClose" title="关闭 (Esc)">✕</button>
      </div>
      <div class="pt-body">
        <div class="pt-src" id="cardSrc"></div>
        <div class="pt-out" id="cardOut"></div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script type="module" src="viewer.js"></script>
  </body>
</html>
